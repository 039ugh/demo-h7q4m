<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezidence Parková čtvrť – vyberte si byt na domě</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/tower.jpg">
<style>
:root{
  --ink:#0f1218; --line:rgba(255,255,255,.14);
  --txt:#f4f1ea; --muted:#b9b4aa; --accent:#ffe500; --accent-ink:#1a1700;
  --glow:rgba(255,229,0,.28);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--txt);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- stage: photo + floors, behaves like background-size:cover ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#0b1020}
#frame{position:absolute;
  --W:max(100vw,220vh); width:var(--W); height:calc(var(--W) / 2.2);
  left:clamp(calc(100vw - var(--W)), calc(50vw - var(--W) * var(--fx,.55)), 0px);
  top:clamp(calc(100vh - var(--W) / 2.2), calc(55vh - var(--W) / 2.2 * .5), 0px);
  transition:transform .75s cubic-bezier(.6,0,.2,1)}
#frame svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#dim{fill:#070a10;opacity:0;transition:opacity .25s}
.hovering #dim{opacity:.5}
#lit,#glow{opacity:0;transition:opacity .2s}
.hovering #lit,.hovering #glow{opacity:1}
#glow{fill:rgba(255,229,0,.16);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.hit{fill:transparent;cursor:pointer}
.invite #glow{animation:inv 1.6s ease-in-out infinite}
@keyframes inv{0%,100%{fill:rgba(255,229,0,.06)}50%{fill:rgba(255,229,0,.26)}}
#shade{position:fixed;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(10,13,20,.85) 0%,rgba(10,13,20,.55) 26%,rgba(10,13,20,0) 46%),
             linear-gradient(0deg,rgba(10,13,20,.55) 0%,rgba(10,13,20,0) 25%)}

/* ---------- hero ---------- */
header.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,3vw,40px);z-index:5;pointer-events:none}
.brand{font-weight:800;letter-spacing:.02em;font-size:14px;background:var(--accent);color:var(--accent-ink);padding:8px 10px;line-height:1;border-radius:4px}
.topcta{pointer-events:auto}
.hero{position:fixed;left:clamp(16px,4vw,64px);top:50%;transform:translateY(-50%);max-width:430px;z-index:4;transition:opacity .3s}
.eyebrow{color:var(--muted);font-size:14px;font-weight:600;letter-spacing:.02em}
h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02;font-weight:800;margin:8px 0 14px;letter-spacing:-.02em}
.lead{color:#ddd8ce;font-size:17px;line-height:1.5}
.facts{display:flex;gap:22px;margin:18px 0 26px}
.facts b{display:block;font-size:24px;font-weight:800;white-space:nowrap}
.facts span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:14px 20px;border-radius:999px;font-size:16px;text-decoration:none;white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.hint{margin-top:16px;color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center}
.hint i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--glow)}
.zooming .hero,.zooming #shade,.zooming #tip{opacity:0}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:6;pointer-events:none;background:rgba(15,18,24,.92);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:210px;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s}
#tip.show{opacity:1;transform:none}
#tip .f{font-weight:800;font-size:18px}
#tip .s{color:var(--muted);font-size:13px;margin-top:2px}
#tip .p{margin-top:8px;font-size:14px}
#tip .p b{color:var(--accent)}
#tip .c{margin-top:8px;font-size:12px;color:var(--muted)}

/* ---------- apartment view ---------- */
#apt{position:fixed;inset:0;z-index:9;background:#1c1b1a;display:grid;grid-template-columns:1fr 420px;opacity:0;pointer-events:none;transition:opacity .4s}
#apt.open{opacity:1;pointer-events:auto}
.viewer{position:relative;overflow:hidden;perspective:1400px;background:radial-gradient(ellipse at 50% 45%,#2b2a29 0%,#252423 60%,#1c1b1a 100%)}
.model{position:absolute;inset:7% 3% 11%;display:grid;place-items:center;transform-style:preserve-3d}
.model img{max-width:100%;max-height:82vh;object-fit:contain;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;filter:drop-shadow(0 40px 60px rgba(0,0,0,.5));
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(0deg,transparent,#000 7%,#000 93%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent),linear-gradient(0deg,transparent,#000 7%,#000 93%,transparent);mask-composite:intersect}
.model.enter{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(50px) rotateX(40deg) scale(.8);opacity:0}to{transform:none;opacity:1}}
.model.plan img{background:#fff;padding:18px;border-radius:12px;-webkit-mask-image:none;mask-image:none;filter:drop-shadow(0 30px 50px rgba(0,0,0,.45))}
.vlabel{position:absolute;left:24px;top:22px;display:flex;gap:10px;align-items:center;z-index:2}
.vlabel .pill{background:rgba(15,18,24,.75);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:700;}
.mini{position:absolute;right:20px;top:18px;width:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0b1020;z-index:2;cursor:pointer}
.mini svg{display:block;width:100%;height:auto}
.mini span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:800;background:rgba(15,18,24,.8);padding:3px 6px;border-radius:5px}
.tabs{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(15,18,24,.8);padding:5px;border-radius:999px;border:1px solid var(--line);z-index:2}
.tabs button{white-space:nowrap;padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--txt);color:var(--ink)}
.gal{position:absolute;inset:0;display:none}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.gal img.on{opacity:1}
.gal .nav{position:absolute;top:50%;width:48px;height:48px;border-radius:50%;background:rgba(15,18,24,.7);font-size:22px;transform:translateY(-50%);z-index:2}
.gal .prev{left:18px}.gal .next{right:18px}
.nomodel{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);color:var(--muted);font-size:13px;background:rgba(15,18,24,.7);padding:7px 12px;border-radius:8px;white-space:nowrap;z-index:2}

.fplan{position:absolute;inset:74px 64px 84px 112px;display:none}
.fpart{position:absolute;inset:0;display:none;align-items:center;justify-content:center;perspective:2200px;perspective-origin:50% 35%}
.fpart.cur,.fpart.ghost{display:flex}
.plate{position:relative;transform-style:preserve-3d;transform:rotateX(54deg) rotateZ(-34deg)}
.plate svg,.slab,.shd{-webkit-mask:var(--cut) 0 0/100% 100% no-repeat;mask:var(--cut) 0 0/100% 100% no-repeat}
.plate svg{position:relative;display:block;background:var(--cut) 0 0/100% 100% no-repeat}
.slab{position:absolute;inset:0;background:#5d5852;transform:translateZ(-14px)}
.slab.s2{background:#8a847b;transform:translateZ(-7px)}
.shd{position:absolute;inset:0;background:#000;opacity:.55;transform:translateZ(-60px) scale(1.02);filter:blur(22px)}
.dimr{fill:#10131a;opacity:.46;pointer-events:none}
.fu{fill:#ffd400;fill-opacity:.14;stroke:#ffd400;stroke-width:4;stroke-linejoin:round;cursor:pointer;transition:fill-opacity .15s}
.fu:hover,.fu.on{fill-opacity:.42}
.anc{fill:none}
.pins{position:absolute;inset:0;pointer-events:none;z-index:2}
.pin{position:absolute;pointer-events:auto;transform:translate(-50%,calc(-100% - 16px));background:#fff;color:#14171d;border-radius:10px;padding:7px 11px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.4);display:flex;gap:7px;align-items:baseline;transition:background .15s}
.pin::after{content:"";position:absolute;left:calc(50% + var(--dx,0px));top:100%;width:2px;height:16px;background:#fff;transform:translateX(-50%)}
.pin::before{content:"";position:absolute;left:calc(50% + var(--dx,0px));top:calc(100% + 13px);width:8px;height:8px;border-radius:50%;background:#ffd400;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(255,212,0,.35)}
.pin span{font-weight:700;color:#4a4f5a}
.pin{z-index:2}.pin.dot{z-index:1;margin-left:0!important}
.pin:hover,.pin.on{background:var(--accent);z-index:3}.pin:hover::after,.pin.on::after{background:var(--accent)}
.pin:hover span,.pin.on span{color:var(--accent-ink)}
.pin.dot{padding:0;width:24px;height:24px;border-radius:50%;background:var(--accent);border:5px solid rgba(255,212,0,.4);background-clip:padding-box;transform:translate(-50%,-50%);box-shadow:none}
.pin.dot>*,.pin.dot::after,.pin.dot::before{display:none}
.pin.dot.on,.pin.dot:hover{padding:7px 11px;width:auto;height:auto;border-radius:10px;transform:translate(-50%,calc(-100% - 6px))}
.pin.dot.on>*,.pin.dot:hover>*{display:inline}
.tabs button i{font-style:normal;margin-left:6px;color:#b08f00}.tabs button.on i{color:#8a6f00}
.tabs button:disabled{opacity:.35;cursor:default}
.crumbs{display:flex;align-items:center;gap:6px;background:rgba(15,18,24,.8);border:1px solid var(--line);padding:6px 8px;border-radius:999px;font-size:14px;font-weight:700}
.crumbs button{padding:4px 8px;border-radius:999px;color:var(--muted)}.crumbs button:hover{background:rgba(255,255,255,.1);color:var(--txt)}
.crumbs i{font-style:normal;color:var(--muted);opacity:.6}.crumbs b{padding:4px 8px}
.rail{position:absolute;left:20px;top:84px;bottom:84px;display:flex;flex-direction:column;justify-content:center;gap:4px;z-index:2}
.rail>span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:4px}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:64px;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.06);font-weight:800;font-size:14px}
.rail button i{font-style:normal;font-size:11px;font-weight:800;color:var(--accent)}
.rail button:hover{background:rgba(255,255,255,.14)}
.rail button.on{background:var(--accent);color:var(--accent-ink)}.rail button.on i{color:var(--accent-ink)}
.rail button:disabled{opacity:.28;cursor:default;background:none}
.astep{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 0;padding:8px;border-radius:12px;background:rgba(255,255,255,.05)}
.astep button{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:800;font-size:14px;white-space:nowrap}
.astep button:disabled{opacity:.3;cursor:default}
.astep span{color:var(--muted);font-size:13px;text-align:center}
.fhint{color:var(--muted);font-size:14px;margin:14px 0 4px}
.info{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#14171d}
.info .scroll{overflow:auto;padding:22px 24px 12px;flex:1;min-height:0}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.back{display:inline-flex;gap:8px;align-items:center;color:var(--muted);font-weight:700;font-size:14px}
.fstep{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.fstep button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px}
.fstep button:disabled{opacity:.3;cursor:default}
.info h2{font-size:36px;font-weight:800;letter-spacing:-.02em}
.info .sub{color:var(--muted);margin-top:4px}
.price{font-size:28px;font-weight:800;margin:16px 0 2px;white-space:nowrap}
.price-note{color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.kv div{background:rgba(255,255,255,.05);border-radius:10px;padding:9px 12px}
.kv span{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:16px;white-space:nowrap}
details.rooms{font-size:14px;border-top:1px solid var(--line);padding-top:10px}
details.rooms summary{cursor:pointer;font-weight:700;color:var(--muted);list-style:none;padding:4px 0}
details.rooms summary::after{content:" ▾"}
.rooms div{display:flex;justify-content:space-between;padding:4px 0;color:#ddd8ce}
.rooms b{white-space:nowrap}
.others{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.others h3{font-size:15px;font-weight:800;margin-bottom:8px}
.unit{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px;border:1px solid transparent}
.unit:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.unit.cur{background:rgba(255,229,0,.08);border-color:rgba(255,229,0,.45)}
.unit .th{width:60px;height:44px;border-radius:7px;background:#232833 center/cover;display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:800}
.unit .th.pl{background:#fff center/contain no-repeat}
.unit b{font-size:15px}
.unit .m{color:var(--muted);font-size:12px;margin-top:1px}
.unit .pr{font-weight:800;font-size:14px;text-align:right;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:2px 5px;border-radius:4px;vertical-align:2px}
.info .cta{padding:14px 24px 18px;display:grid;gap:8px;border-top:1px solid var(--line)}
.demo-note{color:var(--muted);font-size:11px;line-height:1.45;margin-top:14px}

/* ---------- mobile ---------- */
@media (max-width:860px){
  #shade{background:linear-gradient(180deg,rgba(10,13,20,.88) 0%,rgba(10,13,20,.4) 30%,rgba(10,13,20,0) 42%),linear-gradient(0deg,rgba(10,13,20,.85) 0%,rgba(10,13,20,0) 24%)}
  #frame{--W:235vw;height:calc(var(--W) / 2.2);left:calc(50vw - var(--W) * .573);top:calc(54vh - var(--W) / 2.2 * .5)}
  #frame svg{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12%,#000 88%,transparent 100%)}
  #tip{left:16px!important;right:16px;top:auto!important;bottom:calc(76px + env(safe-area-inset-bottom))}
  .hero{top:62px;transform:none;left:16px;right:16px;max-width:none}
  h1{font-size:31px;margin:4px 0 6px}
  .lead{display:none}
  .facts{gap:16px;margin:10px 0 0}
  .facts b{font-size:19px}
  .hero .btn{display:none}
  .hint{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));margin:0;background:rgba(15,18,24,.85);padding:12px 14px;border-radius:12px;border:1px solid var(--line);color:var(--txt)}
  #apt{grid-template-columns:1fr;grid-template-rows:54vh 1fr}
  .info{border-left:0;border-top:1px solid var(--line)}
  .info .scroll{padding:16px}
  .info h2{font-size:26px}.price{font-size:22px;margin-top:10px}
  .mini{width:72px;right:10px;top:10px}
  .fplan{inset:58px 6px 60px 6px}.rail{display:none}.plate{transform:rotateX(50deg) rotateZ(-62deg)}.pin{font-size:12px;padding:5px 8px}.crumbs{font-size:12px;padding:4px 6px}
  .model img{max-height:36vh}
  .vlabel{left:12px;top:12px}
  .tabs{bottom:10px}.tabs button{padding:8px 12px;font-size:13px}
  .nomodel{bottom:62px;font-size:12px}
  .info .cta{padding:10px 16px calc(12px + env(safe-area-inset-bottom));grid-template-columns:1fr 1fr}
  .info .cta .btn{padding:12px 10px;font-size:14px}
  .topcta{display:none}
}
.shot *,.shot{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="frame"><svg id="ov" aria-label="Patra domu"></svg></div></div>
<div id="shade"></div>

<header class="top">
  <span class="brand">CENTRAL GROUP · DEMO</span>
  <a class="btn ghost topcta" href="#" data-todo="odkaz na Sjednat schůzku">Sjednat schůzku</a>
</header>

<section class="hero">
  <div class="eyebrow" id="place"></div>
  <h1 id="title"></h1>
  <p class="lead">Najeďte na dům, klikněte na patro a&nbsp;byt se otevře ve&nbsp;3D.</p>
  <div class="facts" id="facts"></div>
  <button class="btn" id="go">Vybrat byt na domě</button>
  <div class="hint"><i></i><span id="hinttxt">Najeďte myší na patro</span></div>
</section>

<div id="tip"></div>

<section id="apt" aria-label="Detail bytu">
  <div class="viewer" id="viewer">
    <div class="vlabel" id="vlabel"></div>
    <div class="mini" id="mini" title="Zpět na dům"></div>
    <div class="model" id="model"></div>
    <div class="gal" id="gal"></div>
    <div class="rail" id="rail"></div>
    <div class="fplan" id="fplan"></div>
    <div class="nomodel" id="nomodel" hidden></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="info">
    <div class="scroll" id="info"></div>
    <div class="cta">
      <a class="btn" href="#" data-todo="formulář Sjednat schůzku s předvyplněným bytem">Domluvit prohlídku</a>
      <a class="btn ghost" id="weblink" href="#" target="_blank" rel="noopener">Detail a PDF</a>
    </div>
  </div>
</section>

<script src="data.js"></script>
<script src="floors.js"></script>
<script>
const SHOT=location.hash.includes('desk'); if(SHOT) document.documentElement.classList.add('shot');
const P=window.PROJECT, U=P.units, NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const nb=s=>String(s).replace(/ /g,' ');
const czk=n=>nb(n.toLocaleString('cs-CZ').replace(/\s/g,' ')+' Kč');
const mil=n=>nb((n/1e6).toLocaleString('cs-CZ',{maximumFractionDigits:1})+' mil. Kč');
const m2=n=>n==null?'–':nb(n.toLocaleString('cs-CZ')+' m²');
const fname=f=>f===0?'Přízemí':f+'. patro';
const touch=matchMedia('(hover:none)').matches&&!location.hash.includes('desk');
const byFloor={}; U.forEach(u=>(byFloor[u.floor]=byFloor[u.floor]||[]).push(u));
Object.values(byFloor).forEach(l=>l.sort((a,b)=>(!!b.model-!!a.model)||a.price-b.price));
const FL=Object.keys(byFloor).map(Number).sort((a,b)=>a-b);
const minP=Math.min(...U.map(u=>u.price));
const pts=p=>p.map(q=>q.join(',')).join(' ');

/* hero */
document.documentElement.style.setProperty('--fx',P.image.focusX);
$('#place').textContent=P.place+' · '+P.house;
$('#title').textContent=P.name;
$('#facts').innerHTML=`<div><b>${U.length}</b><span>volných bytů</span></div><div><b>od ${mil(minP)}</b><span>vč. DPH</span></div><div><b>Hotovo</b><span>dům dokončen</span></div>`;
$('#hinttxt').textContent=touch?'Klepněte na patro domu':'Najeďte myší na patro';

/* house: photo, lit floor = same photo brightened and clipped to the floor's facade shape */
function houseSvg(svg,withHits){
  const W=P.image.w,H=P.image.h, id=svg.id;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=`<defs>
    <clipPath id="${id}sil"><polygon points="${pts(P.sil)}"/></clipPath>
    <clipPath id="${id}fc"><polygon class="fcp"/></clipPath>
    <mask id="${id}hole"><rect width="${W}" height="${H}" fill="#fff"/><g clip-path="url(#${id}sil)"><polygon class="fcp" fill="#000"/></g></mask>
    <filter id="${id}lift"><feComponentTransfer><feFuncR type="linear" slope="1.45" intercept=".04"/><feFuncG type="linear" slope="1.38" intercept=".03"/><feFuncB type="linear" slope="1.1"/></feComponentTransfer></filter>
  </defs>
  <image href="${P.image.src}" width="${W}" height="${H}"/>
  <rect id="dim" width="${W}" height="${H}" mask="url(#${id}hole)"/>
  <g clip-path="url(#${id}sil)">
    <g clip-path="url(#${id}fc)"><image id="lit" href="${P.image.src}" width="${W}" height="${H}" filter="url(#${id}lift)"/></g>
    <polygon id="glow" class="fcp"/>
